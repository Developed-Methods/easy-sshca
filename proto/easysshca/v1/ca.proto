syntax = "proto3";
package easysshca.v1;

// Fields are used only by their corresponding service operation.
message Command {
  string request_id = 1;
  string name = 2;
  string user = 3;
  string zone = 4;
  uint64 max_duration = 5;
  string public_key = 6;
  uint64 duration = 7;
  string totp = 8;
  string secret = 9;
  string replacement_key = 10;
  uint32 page_size = 11;
  string page_token = 12;
  optional bool active = 13;
}
message Resource {
  string id = 1;
  string name = 2;
  string user = 3;
  uint64 max_duration = 4;
  bool active = 5;
  bool totp_enrolled = 6;
  repeated string zones = 7;
  string fingerprint = 8;
}
message Reply {
  string request_id = 1;
  string state = 2;
  repeated Resource resources = 3;
  string next_page_token = 4;
  string api_key = 5;
  string secret = 6;
  string otpauth_uri = 7;
  string public_key = 8;
  string fingerprint = 9;
  string certificate = 10;
  uint64 expires_at = 11;
  uint64 effective_duration = 12;
  string server = 13;
}
message ErrorDetail {
  string request_id = 1;
  string reason = 2;
  bool totp_required = 3;
}

service BootstrapService {
  rpc GetStatus(Command) returns (Reply);
  rpc Unlock(Command) returns (Reply);
}

service AdminService {
  rpc CreateZone(Command) returns (Reply);
  rpc ImportZone(Command) returns (Reply);
  rpc ListZones(Command) returns (Reply);
  rpc UpdateZone(Command) returns (Reply);
  rpc CreateUser(Command) returns (Reply);
  rpc ListUsers(Command) returns (Reply);
  rpc UpdateUser(Command) returns (Reply);
  rpc RemoveUser(Command) returns (Reply);
  rpc GrantZone(Command) returns (Reply);
  rpc RevokeZone(Command) returns (Reply);
  rpc ListUserZones(Command) returns (Reply);
  rpc CreateAccessToken(Command) returns (Reply);
  rpc ListAccessTokens(Command) returns (Reply);
  rpc UpdateAccessToken(Command) returns (Reply);
  rpc RemoveAccessToken(Command) returns (Reply);
  rpc ClearTotp(Command) returns (Reply);
  rpc RotateAdminKey(Command) returns (Reply);
}

service UserService {
  rpc BeginTotpEnrollment(Command) returns (Reply);
  rpc ConfirmTotpEnrollment(Command) returns (Reply);
  rpc RotateToken(Command) returns (Reply);
}

service SigningService {
  rpc SignCertificate(Command) returns (Reply);
}

service CAService {
  rpc GetPublicKey(Command) returns (Reply);
}
