[package]
name = "easy-sshca"
version = "1.0.0"
edition = "2024"
publish = false
description = "An encrypted SSH certificate authority"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
base32 = "0.5"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
home = "0.5"
humantime = "2"
libc = "0.2"
prost = "0.14"
qrcode = { version = "0.14", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "fallible_uint", "hooks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=1.2.0"
sha2 = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
totp-lite = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
