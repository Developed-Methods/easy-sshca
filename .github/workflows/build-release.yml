name: Verify and build
on:
  push:
  pull_request:
  release:
    types: [published]
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl openssh-server
          sudo mkdir -p /run/sshd
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_TOOLCHAIN"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --test ssh_login -- --ignored
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          scripts/check-supply-chain.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools perl openssh-client openssl python3 curl
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}'
          rustup override set "$RUST_TOOLCHAIN"
      - name: Build and test musl
        env:
          CC: musl-gcc
        run: |
          cargo test --locked --target '${{ matrix.target }}'
          cargo build --locked --release --target '${{ matrix.target }}'
          python3 scripts/smoke-release.py 'target/${{ matrix.target }}/release/easy-sshca'
          scripts/package.sh 'target/${{ matrix.target }}/release/easy-sshca' '${{ matrix.target }}' dist
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --target '${{ matrix.target }}'
          cp easy-sshca.cdx.json 'dist/easy-sshca-${{ matrix.target }}.cdx.json'
          cd dist
          sha256sum 'easy-sshca-${{ matrix.target }}.cdx.json' > 'easy-sshca-${{ matrix.target }}.cdx.json.sha256'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easy-sshca-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*/*
