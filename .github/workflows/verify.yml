name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl openssh-server
          sudo mkdir -p /run/sshd
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_TOOLCHAIN"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --test ssh_login -- --ignored
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          rsa_dependencies=$(cargo tree --locked --target all --invert rsa 2>/dev/null)
          if [[ -n "$rsa_dependencies" ]]; then
            echo 'RSA is enabled; remove the audit exception before continuing' >&2
            exit 1
          fi
          cargo audit
          cargo deny check licenses bans sources
