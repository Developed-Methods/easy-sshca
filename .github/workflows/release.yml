name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.98.0

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup override set "$RUST_TOOLCHAIN"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --bin easy-sshca
      - name: Check and package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/easy-sshca"
          "$binary" --help
          mkdir -p dist
          archive="easy-sshca-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C "target/$TARGET/release" easy-sshca
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
